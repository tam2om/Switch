# Aruba Network Manager - reverse proxy (internal HTTPS only).
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time';
  # The query string is not logged: it may contain one-time tokens.
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  # Second layer of the login brute-force protection (the API also throttles and locks accounts).
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # Only internal networks may reach the application (the API enforces the same list).
  geo $anm_allowed {
    default 0;
    127.0.0.1/32 1;   # container health check
    include /etc/nginx/allowed-networks.conf;
  }

  # Pages from the frontend carry their own per-request CSP with a script nonce; it is passed through.
  # Everything else (API, static assets, error pages) gets a strict policy without any inline script.
  map $upstream_http_content_security_policy $anm_csp {
    ""      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    default $upstream_http_content_security_policy;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream anm_backend  { server backend:8000; keepalive 16; }
  upstream anm_frontend { server frontend:3000; keepalive 16; }

  server {
    listen 8080 default_server;
    server_name _;
    if ($anm_allowed = 0) { return 403; }
    location = /health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    if ($anm_allowed = 0) { return 403; }

    include /etc/nginx/security-headers.conf;
    # The applications set some of the same headers; Nginx is the single source to avoid duplicates.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://anm_backend;
    }
    location = /api/v1/auth/mfa/verify {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://anm_backend;
    }
    location = /api/v1/auth/reset {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://anm_backend;
    }

    # API (the interactive API documentation is disabled in production; see ANM_API_DOCS_ENABLED).
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      limit_req_status 429;
      proxy_pass http://anm_backend;
    }

    location = /health { access_log off; proxy_pass http://anm_backend/health; }

    location /_next/static/ {
      proxy_pass http://anm_frontend;
      expires 7d;
      # add_header in a location replaces inherited headers, so include the security headers again.
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, immutable" always;
    }

    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://anm_frontend;
    }
  }
}
