[project]
name = "aruba-network-manager"
version = "1.0.0"
description = "Aruba Network Manager - internal management for Aruba AOS-Switch fleets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36,<2.2",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "netmiko>=4.4",
  "pysnmp>=7.1",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "minio>=7.2",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -W ignore::DeprecationWarning"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
